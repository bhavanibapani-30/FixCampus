<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - College Maintenance System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🛠️</div>
            <h1>Welcome Back</h1>
            <p>Sign in to your campus maintenance account</p>
        </div>

        <div class="auth-content">
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Campus Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="e.g. student1@college.edu or admin@college.edu" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>

                <div class="form-group" id="admin-key-group" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label class="form-label" for="adminKey" style="margin-bottom: 0; color: #4338ca;">
                            🔐 Admin Management Key <span style="font-size: 11px; color: var(--danger);">*</span>
                        </label>
                        <span style="font-size: 11px; color: var(--text-muted); background: var(--primary-light); padding: 2px 6px; border-radius: 4px;">Management Only</span>
                    </div>
                    <input 
                        type="password" 
                        id="adminKey" 
                        class="form-control" 
                        placeholder="Enter secret admin key (e.g. CMS-ADMIN-2026)"
                        style="border-color: #a5b4fc; background: #fdfefe;"
                    >
                    <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
                        🔑 Key required for facility management personnel. Default: <code style="color: var(--primary); font-weight: 700;">CMS-ADMIN-2026</code>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px;">
                    Sign In
                </button>
            </form>

            <!-- Quick Demo Credentials for Fast Evaluation -->
            <div class="demo-accounts">
                <div class="demo-title">⚡ Quick Demo Login Credentials</div>
                <div class="demo-pills">
                    <button type="button" class="demo-pill" onclick="fillDemo('student')">
                        🎓 Student
                    </button>
                    <button type="button" class="demo-pill" onclick="fillDemo('admin')">
                        🛡️ Admin
                    </button>
                    <button type="button" class="demo-pill" onclick="fillDemo('tech')">
                        ⚡ Tech
                    </button>
                </div>
            </div>
        </div>

        <div class="auth-footer">
            Don't have a student account? <a href="register.html">Register here</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
